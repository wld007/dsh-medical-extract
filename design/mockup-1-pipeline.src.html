<!doctype html>
<html lang="zh"><meta charset="utf-8"><title>病历定向抽取 · 产线（效果图）</title>
<style>
html,body{margin:0;background:#0c0b12}
body{width:1600px}
#root{height:1130px}
/*__CSS__*/
/* 本插件新增：模板塔、字段完成度、评测 */
.mx-tpl{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border:1px solid color-mix(in srgb,var(--teal) 45%,transparent);border-radius:8px;background:var(--tealdim)}
.mx-tpl>div{display:flex;flex-direction:column;line-height:16px}.mx-tpl b{font-size:12.5px;color:var(--teal2)}.mx-tpl span{font-size:10.5px;color:var(--ink2)}
.mx-fr{display:grid;grid-template-columns:62px 1fr 40px;gap:8px;align-items:center;font-size:11px;margin-bottom:6px}

.mx-ev .mx-ticks{margin:0;height:10px}
</style>
<body><div id="root"></div>
<script>
const DARK = !/light/.test(location.hash)
/* ------------------------------------------------------------- 迷你 h()：输出 SVG/HTML 字符串 */
const RAW = new Set(['viewBox', 'preserveAspectRatio', 'refX', 'refY', 'markerWidth', 'markerHeight', 'stdDeviation', 'maskUnits'])
function h(tag, attrs, ...kids) {
  let s = '<' + tag
  for (let [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false || k === 'key') continue
    let name = k === 'className' ? 'class' : RAW.has(k) ? k : k.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase())
    if (k === 'style' && typeof v === 'object') v = Object.entries(v).map(([a, b]) => a.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase()) + ':' + (typeof b === 'number' ? b + 'px' : b)).join(';')
    s += ` ${name}="${String(v).replace(/"/g, '&quot;')}"`
  }
  return s + '>' + kids.flat(Infinity).filter((x) => x != null && x !== false).join('') + `</${tag}>`
}
const MONO = 'SF Mono,JetBrains Mono,Menlo,monospace'
const PAL = {
  dark: { fact: '#6cb4ff', judge: '#f38bc8', decide: '#4fd1a5', ink: '#ebe8f4', ink2: '#a49fba', ink3: '#6b6683', bad: '#e5484d', warn: '#f0a63a', vio: '#4cc9e0', ok: '#62c27e', teal: '#8f6ef5' },
  light: { fact: '#1f7fd0', judge: '#c23d8c', decide: '#0f9d78', ink: '#221d33', ink2: '#625b78', ink3: '#958fa9', bad: '#cf3a3f', warn: '#c27a12', vio: '#0f8ea3', ok: '#2f9a55', teal: '#5b3cc4' },
}
const CLAY = {
  dark: { top: '#d8d5e2', left: '#b0abc0', right: '#88839a', edge: 'rgba(0,0,0,.28)', top2: '#e5e2ec', left2: '#bfbacd', right2: '#9a95ab', win: '#34303f', hole: '#433e50', pad: '#24212e', padL: '#1a1822', padR: '#15131c', grid: '#e8e5f0', floorShadow: '#000', card: 'rgba(12,11,18,.88)', cardLine: '#433d58', lamp: '#ece4ff' },
  light: { top: '#e9e6f0', left: '#c9c4d6', right: '#a8a2b8', edge: 'rgba(40,25,80,.2)', top2: '#f3f1f8', left2: '#d6d1e2', right2: '#b6b0c5', win: '#625b74', hole: '#827b96', pad: '#dcd8e5', padL: '#cac5d6', padR: '#b8b2c7', grid: '#5f5878', floorShadow: '#2c2050', card: 'rgba(253,252,255,.94)', cardLine: '#cdc7dc', lamp: '#d9c9ff' },
}
const P = DARK ? PAL.dark : PAL.light
const C = DARK ? CLAY.dark : CLAY.light
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16)
  const ch = [n >> 16, (n >> 8) & 255, n & 255].map((c) => Math.round(k >= 0 ? c + (255 - c) * k : c * (1 + k)))
  return '#' + ch.map((c) => c.toString(16).padStart(2, '0')).join('')
}
const pts = (a) => a.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ')
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647

/* ------------------------------------------------------------- 等轴测（与事件还原插件同一投影） */
const IX = [0.94, 0.26]; const JX = [-0.66, 0.58]
const iso = (i, j, z = 0) => [i * IX[0] + j * JX[0], i * IX[1] + j * JX[1] - z]
const depthOf = (i, j) => i * IX[1] + j * JX[1]
function isoBox(key, i, j, z, a, b, hh, { top, left, right, edge, props } = {}) {
  const s = edge ? { stroke: edge, strokeWidth: 0.6, strokeLinejoin: 'round' } : {}
  return [
    h('polygon', { points: pts([iso(i, j + b, z), iso(i + a, j + b, z), iso(i + a, j + b, z + hh), iso(i, j + b, z + hh)]), fill: left, ...s, ...props }),
    h('polygon', { points: pts([iso(i + a, j, z), iso(i + a, j + b, z), iso(i + a, j + b, z + hh), iso(i + a, j, z + hh)]), fill: right, ...s, ...props }),
    h('polygon', { points: pts([iso(i, j, z + hh), iso(i + a, j, z + hh), iso(i + a, j + b, z + hh), iso(i, j + b, z + hh)]), fill: top, ...s, ...props }),
  ]
}
const leftPatch = (key, i0, i1, j, z0, z1, props) => h('polygon', { points: pts([iso(i0, j, z0), iso(i1, j, z0), iso(i1, j, z1), iso(i0, j, z1)]), ...props })
const rightPatch = (key, i, j0, j1, z0, z1, props) => h('polygon', { points: pts([iso(i, j0, z0), iso(i, j1, z0), iso(i, j1, z1), iso(i, j0, z1)]), ...props })
function isoCyl(ci, cj, z, r, hh) {
  const [x0, y0] = iso(ci, cj, z); const [, y1] = iso(ci, cj, z + hh)
  const rx = r * 1.12; const ry = r * 0.62
  return [
    h('ellipse', { cx: x0, cy: y0, rx, ry, fill: C.right }),
    h('rect', { x: x0 - rx, y: y1, width: rx * 2, height: y0 - y1, fill: 'url(#mx-cyl)' }),
    h('ellipse', { cx: x0, cy: y1, rx, ry, fill: C.top, stroke: C.edge, strokeWidth: 0.6 }),
    h('ellipse', { cx: x0, cy: y1, rx: rx * 0.62, ry: ry * 0.62, fill: C.hole }),
  ]
}

/* ------------------------------------------------------------- 假数据（效果图用，186 位 MDD 病人） */
const STATE_LABEL = { run: '运行中', part: '进行中', hold: '待复核', done: '完成', idle: '未开始' }
const T = { patients: 186, done: 119, stays: 412 }
const stations = [
  { no: 'E1', nm: '读入·事件包', sub: '读事件包；没有事件包时现场切段', big: '412', unit: '次住院', rows: [['病人', '120/186', '']], state: 'part', frac: 0.64 },
  { no: 'E2', nm: '候选召回', sub: '按文书·栏目过滤；关键词、同义词、正则召回', big: '38.6k', unit: '片段', rows: [['未提及', '9.2%', '']], state: 'part', frac: 0.64 },
  { no: 'E3', nm: '取值·补抽', sub: '先投影事件包，取不到再回原文补抽；引语逐字一致', big: '21,904', unit: '值', rows: [['验收①', '184/186', 'warn'], ['投影', '12,480', ''], ['规则补抽', '3,050', ''], ['模型补抽', '6,374', ''], ['引语核对失败', '23', 'warn']], state: 'run', frac: 0.64 },
  { no: 'E4', nm: '归一', sub: '单位·枚举·日期；否定、可疑、既往、计划单列', big: '3,412', unit: '否定', rows: [['验收②', '99.6%', 'ok']], state: 'part', frac: 0.63 },
  { no: 'E5', nm: '汇总·派生', sub: '按粒度与取值规则汇总；派生 TRD、缓解、减分率', big: '286', unit: '冲突', rows: [['验收③', '120/120', 'ok']], state: 'part', frac: 0.62 },
  { no: 'E6', nm: '核验·复核', sub: '双模型背靠背；分歧、冲突转人工裁定', big: '37', unit: '项待办', rows: [['两模型一致', '93.1%', 'ok']], state: 'hold', frac: 0.3 },
  { no: 'E7', nm: '交付', sub: '宽表 → 证据长表 → JSON → 只读核对', big: '119', unit: '人', rows: [['验收④', '119/119', 'ok']], state: 'part', frac: 0.64 },
  { no: 'E0', nm: '模板', sub: 'MDD v0.3 · P0 52 字段 · 已确认', big: '52', unit: '字段', rows: [['版本', 'v0.3', 'ok']], state: 'done', frac: 1 },
]
const SEL = 2

/* ------------------------------------------------------------- 产线主视图 */
function PlantScene() {
  const A = P.teal
  const tone = (s) => (s.state === 'hold' || s.state === 'run' ? A : null)
  const L = 150; const bw = 72; const D = 104; const H = 50
  const h0 = 84 + (L - bw)
  const bay0 = (k) => h0 + (k - 1) * L
  const hallEnd = bay0(5) + bw
  const yard = hallEnd + (L - bw)
  const els = []; const defs = []; const bb = []
  const halo = { stroke: C.card, strokeWidth: 3, paintOrder: 'stroke', strokeLinejoin: 'round' }
  const AMB = { top: shade(A, 0.3), left: A, right: shade(A, -0.32) }
  const RED = { top: shade(P.bad, 0.3), left: P.bad, right: shade(P.bad, -0.35) }
  const CL = { top: C.top, left: C.left, right: C.right, edge: C.edge }
  const CL2 = { top: C.top2, left: C.left2, right: C.right2, edge: C.edge }

  // 地面网格
  const gi0 = -140; const gi1 = yard + 220; const gj0 = -200; const gj1 = D + 170
  const grid = []
  for (let i = gi0; i <= gi1; i += 40) { const a = iso(i, gj0); const b = iso(i, gj1); grid.push(h('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1] })) }
  for (let j = gj0; j <= gj1; j += 40) { const a = iso(gi0, j); const b = iso(gi1, j); grid.push(h('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1] })) }
  defs.push(h('radialGradient', { id: 'mx-fade', cx: '50%', cy: '55%', r: '55%' }, h('stop', { offset: 0, stopColor: '#fff', stopOpacity: 1 }), h('stop', { offset: 1, stopColor: '#fff', stopOpacity: 0 })))
  defs.push(h('filter', { id: 'mx-blur', x: '-30%', y: '-30%', width: '160%', height: '160%' }, h('feGaussianBlur', { stdDeviation: 9 })))
  defs.push(h('filter', { id: 'mx-glow', x: '-50%', y: '-50%', width: '200%', height: '200%' }, h('feGaussianBlur', { stdDeviation: 3.5, result: 'b' }), h('feMerge', {}, h('feMergeNode', { in: 'b' }), h('feMergeNode', { in: 'SourceGraphic' }))))
  defs.push(h('marker', { id: 'mx-arr', viewBox: '0 0 10 10', refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto' }, h('path', { d: 'M0 0L10 5L0 10z', fill: P.ink2 })))
  defs.push(h('linearGradient', { id: 'mx-cyl', x1: 0, x2: 1, y1: 0, y2: 0 }, h('stop', { offset: 0, stopColor: C.left2 }), h('stop', { offset: 0.55, stopColor: C.left }), h('stop', { offset: 1, stopColor: C.right })))
  els.push(h('g', { stroke: C.grid, strokeOpacity: 0.07, strokeWidth: 0.8, mask: 'url(#mx-gridmask)' }, grid))

  // 落地阴影
  const shadow = (i, j, a, b, push = 26) => h('polygon', { points: pts([iso(i + 6, j + 4), iso(i + a + push, j + 4), iso(i + a + push, j + b + push * 0.5), iso(i + 6, j + b + push * 0.5)]), fill: C.floorShadow, opacity: 0.55, filter: 'url(#mx-blur)' })
  const TW = { i: 96, j: -236, a: 56, b: 56, hh: 128 } // E0 模板塔
  els.push(shadow(0, 8, 84, 100), shadow(yard, 6, 150, 130, 14), shadow(TW.i, TW.j, TW.a, TW.b, 40))
  for (let k = 1; k <= 5; k++) els.push(shadow(bay0(k), 0, bw, D, 24))

  // 选中跨的地面高亮
  {
    const [fi, fj, fa, fb] = [bay0(SEL), 0, bw, D]; const m = 10
    const corners = [[fi - m, fj - m], [fi + fa + m, fj - m], [fi + fa + m, fj + fb + m], [fi - m, fj + fb + m]]
    els.push(h('polygon', { points: pts(corners.map(([a, b]) => iso(a, b))), fill: A, opacity: 0.07 }))
    corners.forEach(([ci, cj], q) => {
      const di = q === 0 || q === 3 ? 1 : -1; const dj = q < 2 ? 1 : -1
      els.push(h('polyline', { points: pts([iso(ci + di * 16, cj), iso(ci, cj), iso(ci, cj + dj * 16)]), fill: 'none', stroke: A, strokeWidth: 1.6, opacity: 0.9 }))
    })
  }

  // E0 模板塔：在产线后方，字段规格从塔顶经“规格总线”下发到每道工序
  {
    const { i, j, a, b, hh } = TW; const g = []
    g.push(...isoBox('tp', i - 10, j - 10, 0, a + 20, b + 20, 4, { top: C.pad, left: C.padL, right: C.padR }))
    g.push(...isoBox('t', i, j, 4, a, b, hh, CL))
    g.push(...isoBox('tc', i + 8, j + 8, hh + 4, a - 16, b - 16, 12, CL2))
    // 竖条窗：已确认字段＝点亮
    for (let r = 0; r < 7; r++) for (let c = 0; c < 4; c++) {
      const z = 18 + r * 15; const ii = i + 6 + c * 12
      g.push(leftPatch('', ii, ii + 7, j + b, z, z + 9, { fill: r < 6 ? C.lamp : C.win, opacity: r < 6 ? 0.9 : 0.55 }))
    }
    for (let r = 0; r < 7; r++) g.push(rightPatch('', i + a, j + 10, j + 46, 18 + r * 15, 18 + r * 15 + 3, { fill: C.win, opacity: 0.45 }))
    // 塔顶的“蓝图”全息板
    const z0 = hh + 22
    g.push(h('polygon', { points: pts([iso(i + 6, j + 6, z0), iso(i + a - 6, j + 6, z0), iso(i + a - 6, j + b - 6, z0), iso(i + 6, j + b - 6, z0)]), fill: A, opacity: 0.16, stroke: A, strokeWidth: 1, filter: 'url(#mx-glow)' }))
    for (let q = 1; q < 4; q++) { const p1 = iso(i + 6, j + 6 + q * 11, z0); const p2 = iso(i + a - 6 - q * 6, j + 6 + q * 11, z0); g.push(h('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], stroke: A, strokeWidth: 1, opacity: 0.8 })) }
    const lp = iso(i + a / 2, j + b / 2, z0 + 2)
    g.push(h('text', { x: lp[0], y: lp[1] - 4, textAnchor: 'middle', fill: A, fontSize: 10, fontWeight: 700, fontFamily: MONO, ...halo }, 'MDD v0.3'))
    els.push(h('g', {}, g))
    bb.push(iso(i - 10, j - 10, 0), iso(i + a, j, z0 + 30))
  }
  // 规格总线：沿产线后沿，从塔通到各工序屋顶
  const BUSJ = -24; const BUSZ = 74
  {
    const g = []
    const a = iso(TW.i + TW.a / 2, TW.j + TW.b, BUSZ + 26); const b = iso(TW.i + TW.a / 2, BUSJ, BUSZ)
    const c = iso(bay0(5) + bw / 2, BUSJ, BUSZ)
    for (let k = 1; k <= 5; k++) { const pi = bay0(k) - 30; g.push(...isoBox('', pi, BUSJ - 3, 0, 5, 5, BUSZ, CL2)) }
    g.push(h('polyline', { points: pts([a, b, c]), fill: 'none', stroke: C.left2, strokeWidth: 5, strokeLinejoin: 'round', strokeLinecap: 'round' }))
    g.push(h('polyline', { points: pts([a, b, c]), fill: 'none', stroke: A, strokeWidth: 2, strokeDasharray: '2 8', className: 'mx-flow', filter: 'url(#mx-glow)', strokeLinecap: 'round' }))
    // 说明见右上图例：紫色流线＝字段规格下发
    els.push(h('g', {}, g))
  }

  // E1 读入楼
  {
    const s = stations[0]; const g = []
    g.push(...isoBox('ramp', -60, 44, 0, 60, 24, 8, CL))
    g.push(...isoBox('b', 0, 8, 0, 84, 100, 88, CL))
    g.push(...isoBox('cap', 8, 18, 88, 50, 40, 10, CL2))
    g.push(...isoBox('vent', 56, 70, 88, 18, 22, 14, CL2))
    const wins = []
    for (let z = 66; z >= 14; z -= 13) for (let i = 8; i < 78; i += 12) wins.push([i, z])
    const litN = Math.round(T.done / T.patients * wins.length)
    wins.forEach(([i, z], q) => { const lit = q < litN; g.push(leftPatch('', i, i + 7, 108, z, z + 6, { fill: lit ? C.lamp : C.win, opacity: lit ? 0.95 : 0.55 })) })
    els.push(h('g', {}, g))
  }

  // 走廊与验收门：① 引语逐字一致（E3 出口）② 值在值域（E4 出口）③ 可回溯原文（E5 出口）④ 一致或已裁定（E6 出口）
  const GATE_AFTER = { 3: ['①', '184/186', P.bad], 4: ['②', '99.6%', P.ok], 5: ['③', '120/120', P.ok], 6: ['④', '119/119', P.ok] }
  const corridor = (i0, i1, k) => {
    const cj = D - 30
    const a = iso(i0, cj + 24, 24); const b = iso(i1, cj + 24, 24)
    let gate = null
    if (GATE_AFTER[k]) {
      const [g, label, gc] = GATE_AFTER[k]
      const gi = (i0 + i1) / 2; const lt = iso(gi, cj + 12, 54)
      gate = h('g', {},
        h('polyline', { points: pts([iso(gi, cj - 2, 32), iso(gi, cj - 2, 46), iso(gi, cj + 26, 46), iso(gi, cj + 26, 32)]), fill: 'none', stroke: gc, strokeWidth: 2.2, strokeLinejoin: 'round' }),
        h('text', { x: lt[0], y: lt[1], textAnchor: 'middle', fill: gc, fontSize: 10, fontFamily: MONO, ...halo }, `${g} ${label}`))
    }
    return h('g', {},
      isoBox('c', i0, cj, 14, i1 - i0, 24, 18, CL2),
      leftPatch('', i0 + 2, i1 - 2, cj + 24, 19, 29, { fill: C.win, opacity: 0.6 }),
      h('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: A, strokeWidth: 2.4, strokeLinecap: 'round', strokeDasharray: '2 8', filter: 'url(#mx-glow)' }),
      gate)
  }

  // E2–E6：每道工序一栋小楼
  for (let k = 1; k <= 5; k++) {
    const s = stations[k]; const i0 = bay0(k)
    const c = tone(s); const lit = !!c
    els.push(corridor(k === 1 ? 84 : bay0(k - 1) + bw, i0, k))
    const g = []
    g.push(...isoBox('b', i0, 0, 0, bw, D, H, CL))
    g.push(leftPatch('', i0, i0 + bw, D, 0, 5, { fill: C.right, opacity: 0.6 }))
    for (let w = 0; w < 3; w++) { const wi = i0 + 8 + w * 20; g.push(leftPatch('', wi, wi + 12, D, 20, 36, { fill: lit ? A : C.win, opacity: lit ? 0.85 : 0.6, filter: lit ? 'url(#mx-glow)' : undefined })) }
    const roof = []
    for (let a = 0; a < 4; a++) for (let b2 = 0; b2 < 2; b2++) {
      if (k === 4 && b2 === 1) continue
      if (k === 5 && b2 === 1 && a >= 2) continue
      roof.push([b2, a])
    }
    roof.sort((p, q) => depthOf(p[0] * 30, p[1] * 24) - depthOf(q[0] * 30, q[1] * 24))
    const litN = s.state === 'hold' ? roof.length : s.state === 'run' ? Math.round(s.frac * roof.length) : 0
    roof.forEach(([b2, a], idx) => {
      const ui = i0 + 8 + b2 * 30; const uj = 8 + a * 24
      const on = idx < litN && c
      g.push(...isoBox('', ui, uj, H, 20, 18, 7, on ? { top: shade(c, 0.25), left: c, right: shade(c, -0.3), props: { filter: 'url(#mx-glow)' } } : CL2))
      const f = iso(ui + 10, uj + 9, H + 7)
      g.push(h('ellipse', { cx: f[0], cy: f[1], rx: 7.5, ry: 4, fill: on ? shade(c, -0.45) : C.hole, opacity: 0.85 }))
    })
    if (k === 4) [[i0 + 50, 20], [i0 + 54, 50], [i0 + 50, 80]].forEach(([ci, cj], q) => g.push(...isoCyl(ci, cj, H, 5, 30 + q * 6)))
    if (k === 5) g.push(...isoBox('', i0 + 36, 56, H, 26, 36, 16, CL2), leftPatch('', i0 + 39, i0 + 59, 92, H + 6, H + 12, { fill: c ?? C.win, opacity: c ? 0.9 : 0.6 }))
