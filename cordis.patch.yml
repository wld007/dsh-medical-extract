- insert:
    - id: medical-extract
      name: 'dsh-medical-extract'
      config:
        # 输出根目录；空 = 输入旁的 _medical-extract
        outputRoot: ''
        # 默认抽取模板 id（内置：mdd、stroke-ais、ad、hf、t2dm、ckd-hd、nsclc；我的模板放在插件数据目录 templates/）
        template: mdd
        # hybrid：模型通读＋规则票；model：模型通读，不出规则票；rules：不调模型，召回词定位后规则取值
        extractMode: hybrid
        # 只跑这些优先级的字段（空 = 全部），如 [P0]
        priorities: []
        # 通用文件的字段映射（空 = 自动识别）：text、id、patient、encounter、type、time、title
        mapping: {}
        # 病历内容只发往这里配置的端点（通常为本机或内网）
        modelEnabled: true
        baseURL: ''
        model: ''
        # 核验模型：抽样背靠背重抽，统计各字段一致率；空 = 不做抽样核验
        verifyBaseURL: ''
        verifyModel: ''
        disableThinking: true
        timeoutMs: 120000
        # 全局同时进行的模型请求数（分到各工作线程）
        modelConcurrency: 8
        # 工作线程数；0 = 自动（CPU 数 - 1，最多 8）
        workers: 0
        # p_doc 导出：每个分片的病人数
        shardUnits: 20
        # 抽样核验：文书抽样比例；每个字段每个分片至少核验几份
        verifySampleRate: 0.02
        verifyMinPerField: 2
        # 验收门④：抽样一致率阈值
        verifyThreshold: 0.9
        # 格式识别（通用文件）：按表识别类别、写成时间、病人、就诊、栏目
        formatRecognition: true
        # 数据元对照表（编码→中文名；csv／xlsx／json 两列）；空 = 不用
        elementDict: ''
        # 借用病历事件还原插件格式库里已采用的识别结果（只读）
        borrowFormats: true
        # 格式未定的表：generic＝先按通用读法读；skip＝跳过，等在「格式」页确认
        heldTables: generic
        # 值不超过这个数时另出一份 result.xlsx
        xlsxMaxRows: 200000
        showSidebarEntry: true
